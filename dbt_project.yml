name: 'tpch_medallion'
version: '1.0.0'
config-version: 2

profile: 'tpch_medallion'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Make sure the governance tags exist before anything is built
on-run-start:
  - "{{ create_governance_tags() }}"

models:
  tpch_medallion:

    # Write the YAML descriptions into Snowflake as comments
    +persist_docs:
      relation: true
      columns: true

    # Apply the Snowflake object tags after each model is built
    +post-hook: "{{ apply_tags() }}"

    bronze:
      +schema: bronze
      +materialized: table
      +tags: ['bronze']
      +meta:
        layer: 'bronze'
        domain: 'sales'
        owner: 'data_engineering'
        certified: 'false'

    silver:
      +schema: silver
      +materialized: table
      +tags: ['silver']
      +meta:
        layer: 'silver'
        domain: 'sales'
        owner: 'data_engineering'
        certified: 'false'

    gold:
      +schema: gold
      +materialized: table
      +tags: ['gold']
      +meta:
        layer: 'gold'
        domain: 'sales'
        owner: 'data_engineering'
        certified: 'true'

    # (materialized='semantic_view' is set inside the model file itself;
    # persist_docs is off because that materialization may not support it)
    semantic:
      +schema: semantic
      +tags: ['semantic']
      +persist_docs:
        relation: false
        columns: false

seeds:
  tpch_medallion:
    +schema: governance