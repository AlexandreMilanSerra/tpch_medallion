name: 'tpch_medallion'
version: '1.0.0'
config-version: 2

profile: 'tpch_medallion'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  tpch_medallion:

    # Bronze: raw copy of the source
    bronze:
      +schema: bronze
      +materialized: table
      +tags: ['bronze']

    # Silver: cleaned and conformed
    silver:
      +schema: silver
      +materialized: table
      +tags: ['silver']

    # Gold: star schema
    gold:
      +schema: gold
      +materialized: table
      +tags: ['gold']

    # Semantic layer: semantic view on the Gold star
    # (materialized='semantic_view' is set inside the model file itself)
    semantic:
      +schema: semantic
      +tags: ['semantic']

# Taxonomy and ontology seeds
seeds:
  tpch_medallion:
    +schema: governance