tpch_medallion:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: DBT_CI_ROLE
      database: TPCH_CI
      warehouse: DBT_WH
      schema: DBT_CI
      threads: 4