version: 2

models:
  - name: stg_geography
    description: Nation joined to its region. One row per nation.
    columns:
      - name: nation_id
        description: Nation identifier.
        data_tests: [unique, not_null]
      - name: region_name
        description: Name of the region the nation belongs to.
        data_tests: [not_null]

  - name: stg_customer
    description: Cleaned customers with standardised names and types. One row per customer.
    columns:
      - name: customer_id
        description: Customer identifier. Stable key used later by the SCD snapshot.
        data_tests: [unique, not_null]
      - name: nation_id
        description: Nation where the customer is located.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_geography')
                field: nation_id
      - name: address
        description: Address. Personal data in a real project. 2026-11-18.
        meta:
          pii: true
      - name: phone
        description: Phone number. Personal data in a real project.
  
  - name: rej_lineitem
    description: >
      Quarantine table. Order lines from Bronze that broke a quality rule,
      with the reason. Empty when the data is clean.
    columns:
      - name: reject_reason
        description: Which rule the row broke.
        data_tests:
          - accepted_values:
              arguments:
                values: ['discount out of range', 'receipt before ship', 'non-positive quantity']