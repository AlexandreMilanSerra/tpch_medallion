version: 2

models:
  - name: dim_customer
    description: Customer dimension with nation and region folded in. One row per customer.
    columns:
      - name: customer_id
        description: Customer identifier.
        data_tests: [unique, not_null]
      - name: market_segment
        description: Customer market segment.
      - name: region_name
        description: Region of the customer.
        data_tests: [not_null]

  - name: dim_supplier
    description: Supplier dimension with nation and region folded in. One row per supplier.
    columns:
      - name: supplier_id
        description: Supplier identifier.
        data_tests: [unique, not_null]
      - name: region_name
        description: Region of the supplier.
        data_tests: [not_null]

  - name: dim_part
    description: Part dimension. One row per part.
    columns:
      - name: part_id
        description: Part identifier.
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension generated by the date_dimension macro, 1992 to 1998. One row per day.
    columns:
      - name: date_day
        description: Calendar date.
        data_tests: [unique, not_null]

  - name: fct_order_lines
    description: >
      Fact table at order-line grain. Holds revenue, discount, margin proxy and
      delivery performance, linked to the customer, supplier, part and date dimensions.
    columns:
      - name: order_line_id
        description: Unique key of the order line (order id plus line number).
        data_tests: [unique, not_null]
      - name: customer_id
        description: Link to dim_customer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: part_id
        description: Link to dim_part.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_part')
                field: part_id
      - name: supplier_id
        description: Link to dim_supplier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_id
      - name: order_date
        description: Link to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: net_revenue
        description: Extended price after discount.
      - name: gross_margin
        description: Net revenue minus supply cost. A proxy, not accounting margin.
      - name: is_late_delivery
        description: True when the goods were received after the committed date.